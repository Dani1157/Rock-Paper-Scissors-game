<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Pro | 2025</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 2rem auto;
        }
        
        .ttt-cell {
            aspect-ratio: 1;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--primary-neon);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--primary-neon);
            text-shadow: 0 0 20px var(--primary-neon);
        }
        
        .ttt-cell:hover {
            background: rgba(0, 243, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--primary-neon);
        }
        
        .ttt-cell.x {
            color: var(--secondary-neon);
            text-shadow: 0 0 20px var(--secondary-neon);
        }
        
        .ttt-cell.o {
            color: var(--tertiary-neon);
            text-shadow: 0 0 20px var(--tertiary-neon);
        }
        
        .powerup-indicator {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .powerup-item {
            text-align: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid var(--primary-neon);
        }
    </style>
</head>
<body>
    <div class="cyber-background">
        <div class="gradient-orb"></div>
        <div class="gradient-orb-2"></div>
        <div class="grid-overlay"></div>
    </div>
    
    <div class="game-container">
        <nav class="game-nav">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Arcade</a>
            <div class="game-title">
                <span class="neon-small">TIC TAC TOE</span>
                <span class="game-version">PRO</span>
            </div>
            <div class="nav-actions">
                <button class="nav-btn" id="soundToggle"><i class="fas fa-volume-up"></i></button>
            </div>
        </nav>
        
        <div class="rps-game-area">
            <div class="vs-header">
                <div class="player-tag">
                    <i class="fas fa-user-astronaut"></i>
                    <span>PLAYER X</span>
                </div>
                <div class="vs-divider">
                    <span class="vs-text">VS</span>
                </div>
                <div class="bot-tag">
                    <i class="fas fa-robot"></i>
                    <span>BOT O</span>
                </div>
            </div>
            
            <div class="ttt-board" id="board">
                <!-- Cells will be generated by JS -->
            </div>
            
            <div class="powerup-indicator">
                <div class="powerup-item">
                    <i class="fas fa-bolt"></i>
                    <span>Double Move</span>
                </div>
                <div class="powerup-item">
                    <i class="fas fa-shield"></i>
                    <span>Block</span>
                </div>
                <div class="powerup-item">
                    <i class="fas fa-undo"></i>
                    <span>Undo</span>
                </div>
            </div>
            
            <div class="scoreboard" style="justify-content: center;">
                <div class="score-item">
                    <div class="score-header">
                        <i class="fas fa-trophy"></i>
                        <span>GAMES</span>
                    </div>
                    <div class="score-value" id="gamesPlayed">0</div>
                </div>
            </div>
            
            <div class="game-controls">
                <button class="control-btn" id="resetGame">
                    <i class="fas fa-rotate-right"></i>
                    <span>New Game</span>
                </button>
            </div>
        </div>
    </div>
    
    <script src="assets/js/tictactoe.js"></script>
</body>
</html>
